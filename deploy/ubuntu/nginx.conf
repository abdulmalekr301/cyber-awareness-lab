worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=api:10m rate=500r/s;
  # The only published socket is host loopback. The host's game virtual host
  # overwrites these headers after checking its Cloudflare peer. Authenticated
  # local/tunnel operators are also inside this trust boundary.
  # Ignore inbound X-Forwarded-For: only consume the host's single X-Real-IP.
  map $http_x_real_ip $cyberlab_client_ip {
    "" $remote_addr;
    default $http_x_real_ip;
  }
  map $http_x_forwarded_proto $cyberlab_forwarded_proto {
    default $scheme;
    http http;
    https https;
  }
  upstream cyberlab_app { server app:3000; keepalive 32; }
  server {
    listen 8080;
    client_max_body_size 32k;
    location /api/ {
      limit_req zone=api burst=1500 nodelay;
      proxy_pass http://cyberlab_app;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $cyberlab_client_ip;
      proxy_set_header X-Forwarded-For $cyberlab_client_ip;
      proxy_set_header X-Forwarded-Proto $cyberlab_forwarded_proto;
    }
    location / {
      proxy_pass http://cyberlab_app;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $cyberlab_client_ip;
      proxy_set_header X-Forwarded-For $cyberlab_client_ip;
      proxy_set_header X-Forwarded-Proto $cyberlab_forwarded_proto;
    }
  }
}
