# Host Nginx 1.24 configuration for /etc/nginx/conf.d/cyberlab.conf.
# Cloudflare trust is server-scoped; never include its file at http scope.
server {
    listen 80;
    server_name gameserver.ly www.gameserver.ly;

    include /etc/nginx/cyberlab/cloudflare-realip.inc;
    # Return-only guard also rejects mismatched SNI/Host selections.
    if ($host !~ ^(gameserver\.ly|www\.gameserver\.ly)$) { return 421; }
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gameserver.ly www.gameserver.ly;

    ssl_certificate /etc/ssl/certs/gameserver.ly.pem;
    ssl_certificate_key /etc/ssl/private/gameserver.ly.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cyberlab_public_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/cyberlab/cloudflare-realip.inc;
    if ($host !~ ^(gameserver\.ly|www\.gameserver\.ly)$) { return 421; }
    client_max_body_size 32k;

    location / {
        # No URI suffix: preserve every request path and query string.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # Replace, rather than append to, client-supplied forwarding headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
