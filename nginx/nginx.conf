events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  # A venue Wi-Fi can put hundreds of participants behind one public IP.
  # This is an abuse guard, not a per-participant quota.
  limit_req_zone $binary_remote_addr zone=api:10m rate=500r/s;
  upstream cyberlab_app { server app:3000; keepalive 32; }
  server {
    listen 80;
    client_max_body_size 32k;
    location /api/ {
      limit_req zone=api burst=1500 nodelay;
      proxy_pass http://cyberlab_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      proxy_pass http://cyberlab_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
